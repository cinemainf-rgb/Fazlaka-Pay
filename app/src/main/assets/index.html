<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fazlaka Pay - فزلكا</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Tahoma;background:#f1f5f9;color:#0f172a}header{background:#0f172a;color:#fff;padding:18px 16px}header h1{margin:0;font-size:21px}.wrap{padding:14px;max-width:760px;margin:auto}.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:12px}.big{font-size:28px;font-weight:800}.muted{color:#64748b;font-size:13px}.row{display:flex;gap:10px}.row>div{flex:1;background:#f8fafc;border-radius:12px;padding:10px;text-align:center}input,select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #cbd5e1;font-size:15px;margin-top:8px}button{background:#0f172a;color:#fff;border:0;font-weight:700;cursor:pointer}button.ghost{background:#e2e8f0;color:#0f172a}button.green{background:#16a34a}.small{font-size:12px;padding:6px 10px;width:auto}.flex{display:flex;gap:8px;align-items:center}.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid #eef2f7}.machine{flex:1;text-align:center;padding:12px;border-radius:12px;cursor:pointer;border:2px solid #e2e8f0;background:#f8fafc}.machine.sel{border-color:#16a34a;background:#f0fdf4}.catBtn{flex:1 0 18%;min-width:58px;padding:10px 8px;background:#f8fafc;color:#0f172a;border:2px solid #e2e8f0;border-radius:12px;font-weight:700}.catBtn.sel{background:#16a34a;color:#fff;border-color:#16a34a}.walletCard{background:#f8fafc;border:2px solid #e2e8f0;border-radius:14px;padding:14px;margin-bottom:10px}.walletHead{display:flex;justify-content:space-between;align-items:center}.walletName{font-size:17px;font-weight:800}.walletLimit{font-size:12px;color:#64748b;background:#fff;border:1px solid #e2e8f0;padding:4px 8px;border-radius:20px}.walletBal{font-size:26px;font-weight:800;color:#0e7490;margin:8px 0 2px}.walletStats{display:flex;gap:8px;margin:8px 0}.walletStats div{flex:1;background:#fff;border-radius:10px;padding:8px;text-align:center;font-size:13px}.walletStats b{display:block;font-size:15px}.walletBtns{display:flex;gap:8px;margin-top:10px}.walletBtns button{flex:1}body.hide-nums .big,body.hide-nums .card b{filter:blur(7px)}body.big-font{font-size:19px}body.big-font button,body.big-font input,body.big-font select{font-size:19px;padding:16px}body.big-font .walletBal{font-size:32px}
</style>
</head>
<body>
<div id="pinLock" style="display:none;position:fixed;inset:0;background:#0f172a;z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center">
<div style="font-size:50px">🔒</div>
<h2 style="color:#fff;margin:0">المتجر مقفول</h2>
<p style="color:#94a3b8;margin:0">اكتب الرقم السري عشان تفتح</p>
<input id="pinInput" type="password" inputmode="numeric" placeholder="الرقم السري" style="max-width:280px;text-align:center;font-size:22px">
<button class="green" style="max-width:280px" onclick="unlockPin()">افتح 🔓</button>
<div id="pinErr" style="color:#f87171"></div>
</div>
<header><h1>🏪 Fazlaka Pay</h1></header>
<div class="wrap">
<div id="dailyReminder"></div>
<div class="flex" style="justify-content:flex-end">
<button onclick="toggleBigFont()" style="width:36px;height:36px;padding:0;border-radius:50%;background:#fff;color:#000">A+</button>
<button onclick="toggleHide()" style="width:36px;height:36px;padding:0;border-radius:50%;background:#fff;color:#000">👁️</button>
</div>
<div class="card">
<div class="muted">مبيعات النهاردة</div>
<div class="big" id="todaySales">0 ج</div>
<div class="row" style="margin-top:12px">
<div><span class="muted">كاش</span><b id="cashToday">0</b></div>
<div><span class="muted">آجل / ديون</span><b id="debtToday">0</b></div>
<div><span class="muted">عدد الفواتير</span><b id="invCount">0</b></div>
</div>
</div>
<div style="display:flex;gap:8px;margin-bottom:12px;position:sticky;top:0;z-index:10;background:#f1f5f9;padding:8px 0">
<button id="tabBtn1" class="green" onclick="showTab(1)" style="flex:1;padding:14px;font-size:17px">شحن</button>
<button id="tabBtn2" class="ghost" onclick="showTab(2)" style="flex:1;padding:14px;font-size:17px;border:2px solid #0f172a">بيع</button>
<button id="tabBtn3" class="ghost" onclick="showTab(3)" style="flex:1;padding:14px;font-size:17px;border:2px solid #0f172a">كاش</button>
<button id="tabBtn4" class="ghost" onclick="showTab(4)" style="flex:1;padding:14px;font-size:17px;border:2px solid #0f172a">تقارير</button>
</div>
<div id="tab1">
<div class="card"><h3 style="margin:0">💳 المكنات</h3>
<div style="display:flex;gap:8px;margin-top:10px">
<div class="machine sel" id="m0" onclick="selectMachine(0)"><b>مكنة 1</b><div class="muted">الرصيد المتاح</div><b id="bal0">0 ج</b><div id="machWarn0" style="font-size:12px"></div><br><button class="small green" style="width:100%;margin-top:8px" onclick="event.stopPropagation();addBal(0)">زوّد رصيدك</button></div>
<div class="machine" id="m1" onclick="selectMachine(1)"><b>مكنة 2</b><div class="muted">الرصيد المتاح</div><b id="bal1">0 ج</b><div id="machWarn1" style="font-size:12px"></div><br><button class="small green" style="width:100%;margin-top:8px" onclick="event.stopPropagation();addBal(1)">زوّد رصيدك</button></div>
<div class="machine" id="m2" onclick="selectMachine(2)"><b>مكنة 3</b><div class="muted">الرصيد المتاح</div><b id="bal2">0 ج</b><div id="machWarn2" style="font-size:12px"></div><br><button class="small green" style="width:100%;margin-top:8px" onclick="event.stopPropagation();addBal(2)">زوّد رصيدك</button></div>
</div></div>
<div class="card"><h3 style="margin:0">⚡ شحن الرصيد</h3>
<input id="rechAmount" type="number" placeholder="المبلغ - مثال: 100" oninput="calcRecharge()">
<div class="flex"><input id="rechDeduct" type="number" placeholder="..."><input id="rechSell" type="number" placeholder="..."></div>
<input id="rechCust" placeholder="الزبون">
<button id="rechAjelBtn" class="ghost" onclick="toggleAjel('recharge')">آجل</button>
<button class="green" onclick="doRecharge()">شحن</button></div>
<div class="card"><h3 style="margin:0">🎫 الكروت</h3>
<div id="cardCatRow" style="display:flex;gap:8px;flex-wrap:wrap;padding:6px 2px"></div>
<div class="flex"><input id="cardCatDeduct" type="number" placeholder="..."><input id="cardCatSell" type="number" placeholder="..."></div>
<input id="cardCatCust" placeholder="الزبون">
<button id="cardAjelBtn" class="ghost" onclick="toggleAjel('card')">آجل</button>
<button class="green" onclick="sellCardCat()">بيع</button></div>
<div class="card"><h3 style="margin:0">📶 كروت الجيجات</h3>
<div id="gigaRow" style="display:flex;gap:8px;flex-wrap:wrap;padding:6px 2px"></div>
<div class="flex"><input id="gigaDeduct" type="number" placeholder="..."><input id="gigaSell" type="number" placeholder="..."></div>
<input id="gigaCust" placeholder="الزبون">
<button id="gigaAjelBtn" class="ghost" onclick="toggleAjel('giga')">آجل</button>
<button class="green" onclick="sellGiga()">بيع</button></div>
